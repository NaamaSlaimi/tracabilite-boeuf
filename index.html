<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traçabilité du produit — scannez, vérifiez</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <div class="brand-row">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 6.5V12c0 5.2 3.8 9.6 9 11 5.2-1.4 9-5.8 9-11V6.5L12 2Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M8.5 12.2l2.4 2.4 4.6-4.8" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <h1>Traçabilité du produit</h1>
      <div class="subtitle">Vérification directe sur la blockchain — aucune inscription requise.</div>
    </div>
  </div>

  <div class="section" id="searchSection">
    <div class="row">
      <div>
        <label for="lotIdInput">Identifiant du lot (imprimé sur l'étiquette)</label>
        <input type="text" id="lotIdInput" placeholder="ex : BF-TN-00001">
      </div>
      <div style="flex:0;">
        <button id="lookupBtn">Vérifier</button>
      </div>
    </div>
    <div class="error-note" id="lookupError" style="display:none;"></div>
  </div>

  <footer>Projet de Mastère (MRIR) — Traçabilité bœuf sécurisée par IA et blockchain multi-acteurs</footer>
</div>

<script>
// index.html n'a besoin d'aucune librairie blockchain/IPFS : son seul
// rôle est de rediriger vers lot.html?lot=<identifiant>, qui fait tout
// le travail de consultation.
const $ = (id) => document.getElementById(id);

function allerVersLeLot(){
  const lotId = $('lotIdInput').value.trim();
  $('lookupError').style.display = 'none';
  if(!lotId){
    $('lookupError').textContent = "Entrez un identifiant de lot avant de vérifier.";
    $('lookupError').style.display = 'block';
    return;
  }
  window.location.href = `lot.html?lot=${encodeURIComponent(lotId)}`;
}

$('lookupBtn').addEventListener('click', allerVersLeLot);
$('lotIdInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') allerVersLeLot();
});

// Si quelqu'un revient sur index.html avec un ?lot=... dans l'URL (rare,
// mais possible via un vieux lien), on redirige directement vers la bonne
// page plutôt que de laisser un formulaire vide inutile.
(function redirigerSiLotDejaPresent(){
  const params = new URLSearchParams(location.search);
  const lot = params.get('lot');
  if(lot){
    window.location.replace(`lot.html?lot=${encodeURIComponent(lot)}`);
  }
})();
</script>
</body>
</html>
